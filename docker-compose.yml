services:
  im-desktop:
    # 拉取 GitHub Actions 构建好的镜像（推荐）
    image: ghcr.io/wune5/pim:latest
    # 本地构建时注释上面一行，启用下面两行
    # build: .
    container_name: im-desktop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - PORT=8787          # 通知中继端口
    volumes:
      - ./data:/config               # 登录态/聊天数据持久化
      # 宿主机文件夹映射（和容器内互通，方便传文件；目录需存在且属主为 PUID 对应 uid）
      - ./downloads:/config/Downloads
      - ./documents:/config/Documents
      - ./pictures:/config/Pictures
    ports:
      - "8787:8787"        # 通知中继 HTTP 直连入口（可选，走统一入口可不开）
    shm_size: "2gb"        # QQ 是 Electron 应用，shm 太小会闪退
    restart: unless-stopped

  # 统一 HTTPS 入口：桌面和通知页面共用一个端口
  #   https://IP:3001/        -> webtop 桌面（Selkies）
  #   https://IP:3001/relay/  -> IM 通知中继（浏览器弹窗）
  caddy:
    image: caddy:2-alpine
    container_name: pim-caddy
    ports:
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    restart: unless-stopped
    depends_on:
      - im-desktop
