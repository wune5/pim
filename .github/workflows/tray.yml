name: build-tray

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        working-directory: tray-go
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -ldflags "-s -w -H=windowsgui" -o ../dist/pim-tray-windows-amd64.exe .
          $env:GOARCH = "arm64"
          go build -ldflags "-s -w -H=windowsgui" -o ../dist/pim-tray-windows-arm64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: pim-tray-windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        working-directory: tray-go
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/pim-tray-linux-amd64 .
          CGO_ENABLED=0 GOARCH=arm64 go build -ldflags "-s -w" -o ../dist/pim-tray-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: pim-tray-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build (universal binary)
        working-directory: tray-go
        run: |
          mkdir -p ../dist
          GOARCH=amd64 go build -ldflags "-s -w" -o ../dist/pim-tray-darwin-amd64 .
          GOARCH=arm64 go build -ldflags "-s -w" -o ../dist/pim-tray-darwin-arm64 .
          lipo -create ../dist/pim-tray-darwin-amd64 ../dist/pim-tray-darwin-arm64 -output ../dist/pim-tray-darwin-universal
          rm ../dist/pim-tray-darwin-amd64 ../dist/pim-tray-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: pim-tray-darwin
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
