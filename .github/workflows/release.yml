name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            多架构镜像已发布：`docker pull ghcr.io/wune5/pim:latest`

            包含 QQ / 微信 / 钉钉 官方 Linux 客户端 + 桌面通知中继（浏览器消息推送）。

            主要特性：
            - 桌面消息提醒：通知直接注入 Selkies 侧栏（面板 + 未读徽标），叠加 toast 与系统弹窗，历史消息不重复打扰
            - 单一入口：`https://<host>:3001/` 即桌面 + 通知一体，无需单独开通知页
            - 系统界面简体中文；Selkies 帧率锁定 30fps，全屏流畅
            - 通知中继为容器常驻服务，桌面未启动时 `/relay/` 依然可用

            部署说明见仓库 [README](https://github.com/wune5/pim#部署步骤)。
